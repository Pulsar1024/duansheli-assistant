<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>断舍离物品管理系统</title>
<style>
html {
    scroll-behavior: smooth;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, -apple-system, sans-serif;
}
body{
    background:#f7f8fa;
    padding:20px;
    max-width:1200px;
    margin:0 auto;
}
.wrap-center{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:90vh;
}
.auth-box{
    background:white;
    padding:36px;
    border-radius:16px;
    box-shadow:0 2px 12px rgba(0,0,0,0.1);
    width:420px;
    max-width:92vw;
}
.auth-box h2{
    text-align:center;
    margin-bottom:24px;
}
.tabs{
    display:flex;
    margin-bottom:20px;
    gap:8px;
}
.tab{
    flex:1;
    text-align:center;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    background:#eee;
}
.tab.active{
    background:#635bff;
    color:white;
}
.hide{
    display:none !important;
}
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
    gap:12px;
    flex-wrap: wrap;
}
.logo{
    font-size:22px;
    font-weight:bold;
}
.nav a{
    margin:0 12px;
    text-decoration:none;
    color:#333;
}
.btn{
    background:#635bff;
    color:white;
    padding:8px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
}
.btn-secondary{
    background:#36cba7;
}
.btn-logout{
    background:#dd4444;
}
.btn-del{
    background:#ff6b6b;
}
.btn-edit{
    background:#ff9f43;
}
.card-wrap{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:20px;
    margin-bottom:30px;
}
.card{
    background:white;
    padding:24px;
    border-radius:16px;
    box-shadow:0 2px 10px #00000010;
}
.card h3{
    margin-bottom:12px;
}
.item-list{
    margin:30px 0;
}
.item-card{
    padding:20px;
    border-radius:12px;
    margin:16px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}
.status-使用中{
    background:#eafaf1;
}
.status-疑似闲置{
    background:#fff9e6;
}
.status-待出售{
    background:#e8f4ff;
}
.status-待丢弃{
    background:#ffeef0;
}
.status-已处理{
    background:#f1f2f4;
}
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#00000060;
    align-items:center;
    justify-content:center;
    z-index:99;
}
.modal-content{
    background:white;
    padding:30px;
    border-radius:16px;
    width:420px;
    max-width: 92vw;
}
input, select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:8px;
}
.btn-group{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}
.user-tip{
    margin-top:12px;
    text-align:center;
    color:#666;
    font-size:14px;
}
</style>
</head>
<body>
<div class="wrap-center" id="authPage">
    <div class="auth-box">
        <h2>断舍离物品管理系统</h2>
        <div class="tabs">
            <div class="tab active" id="tabLogin" onclick="switchAuth('login')">登录</div>
            <div class="tab" id="tabReg" onclick="switchAuth('reg')">注册</div>
        </div>
        <div id="loginForm">
            <label>账号</label>
            <input id="loginUser" placeholder="输入账号">
            <label>密码</label>
            <input id="loginPwd" type="password" placeholder="输入密码">
            <button class="btn" style="width:100%;margin-top:16px" onclick="login()">登录</button>
        </div>
        <div id="regForm" class="hide">
            <label>账号</label>
            <input id="regUser" placeholder="设置账号">
            <label>密码</label>
            <input id="regPwd" type="password" placeholder="设置密码">
            <label>确认密码</label>
            <input id="regPwd2" type="password" placeholder="再次输入密码">
            <button class="btn" style="width:100%;margin-top:16px" onclick="register()">注册</button>
        </div>
        <p class="user-tip">数据保存在服务端，跨设备登录可同步</p>
    </div>
</div>

<div id="mainPage" class="hide">
    <div class="header">
        <div class="logo">断舍离物品管理系统</div>
        <div class="nav">
            <a href="#items">我的物品</a>
            <a href="#wishlist">种草清单</a>
        </div>
        <div>
            <span id="currentUser">当前用户：-</span>
            <button class="btn" onclick="openModal()">录入物品</button>
            <button class="btn btn-secondary" onclick="openWishModal()">添加种草</button>
            <button class="btn btn-logout" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="card-wrap">
        <div class="card">
            <h3>物品统计</h3>
            <p id="stat_text">加载中...</p>
        </div>
        <div class="card">
            <h3>种草统计</h3>
            <p id="wish_stat">加载中...</p>
        </div>
        <div class="card">
            <h3>消费统计</h3>
            <p id="money_stat">加载中...</p>
        </div>
    </div>

    <section id="items" class="item-list">
        <h2 style="margin-bottom:16px">物品列表</h2>
        <div id="item_container"></div>
    </section>

    <section id="wishlist" class="item-list">
        <h2 style="margin-bottom:16px">种草清单（冷静期）</h2>
        <div id="wish_container"></div>
    </section>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>新增物品</h3>
            <label>物品名称</label>
            <input id="name" placeholder="例如：红色运动鞋">
            <label>品类</label>
            <select id="category">
                <option>衣物</option>
                <option>电子产品</option>
                <option>书籍</option>
                <option>其他</option>
            </select>
            <label>状态</label>
            <select id="status">
                <option>使用中</option>
                <option>疑似闲置</option>
                <option>待出售</option>
                <option>待丢弃</option>
                <option>已处理</option>
            </select>
            <button class="btn" style="margin-top:16px;width:100%" onclick="saveItem()">保存</button>
            <button style="margin-top:10px;width:100%;cursor:pointer" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <div class="modal" id="editItemModal">
        <div class="modal-content">
            <h3>编辑物品</h3>
            <input type="hidden" id="editItemId">
            <label>物品名称</label>
            <input id="edit_name">
            <label>品类</label>
            <select id="edit_category">
                <option>衣物</option>
                <option>电子产品</option>
                <option>书籍</option>
                <option>其他</option>
            </select>
            <label>状态</label>
            <select id="edit_status">
                <option>使用中</option>
                <option>疑似闲置</option>
                <option>待出售</option>
                <option>待丢弃</option>
                <option>已处理</option>
            </select>
            <button class="btn" style="margin-top:16px;width:100%" onclick="updateItem()">保存修改</button>
            <button style="margin-top:10px;width:100%;cursor:pointer" onclick="closeEditItemModal()">关闭</button>
        </div>
    </div>

    <div class="modal" id="wishModal">
        <div class="modal-content">
            <h3>新增种草</h3>
            <label>商品名称</label>
            <input id="wish_name" placeholder="例如：降噪耳机 Pro">
            <label>价格（元）</label>
            <input id="wish_price" type="number" placeholder="2499">
            <label>冷静天数</label>
            <input id="wish_cool" type="number" placeholder="4">
            <label>刚需等级（1~5）</label>
            <input id="wish_level" type="number" min="1" max="5" placeholder="2">
            <button class="btn" style="margin-top:16px;width:100%" onclick="saveWish()">保存种草</button>
            <button style="margin-top:10px;width:100%;cursor:pointer" onclick="closeWishModal()">关闭</button>
        </div>
    </div>

    <div class="modal" id="editWishModal">
        <div class="modal-content">
            <h3>编辑种草</h3>
            <input type="hidden" id="editWishId">
            <label>商品名称</label>
            <input id="edit_wish_name">
            <label>价格（元）</label>
            <input id="edit_wish_price" type="number">
            <label>冷静天数</label>
            <input id="edit_wish_cool" type="number">
            <label>刚需等级（1~5）</label>
            <input id="edit_wish_level" type="number" min="1" max="5">
            <button class="btn" style="margin-top:16px;width:100%" onclick="updateWish()">保存修改</button>
            <button style="margin-top:10px;width:100%;cursor:pointer" onclick="closeEditWishModal()">关闭</button>
        </div>
    </div>
</div>

<script>
// ============ 修改这里，如果后端部署到别的地址 ============
const BASE_URL = "http://localhost:3000/api";

let currentUsername = localStorage.getItem("ds_user") || "";
let userData = { items: [], wish: [] };

async function apiFetch(url, opt = {}) {
    const res = await fetch(`${BASE_URL}${url}`, opt);
    return await res.json();
}

async function loadUserData() {
    const ret = await apiFetch(`/data/${currentUsername}`);
    if (ret.ok) {
        userData = ret.data;
    }
}
async function saveToServer() {
    await apiFetch(`/data/${currentUsername}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(userData)
    });
}

function switchAuth(mode){
    const loginForm = document.getElementById("loginForm");
    const regForm = document.getElementById("regForm");
    if(mode === "login"){
        loginForm.classList.remove("hide");
        regForm.classList.add("hide");
        document.getElementById("tabLogin").classList.add("active");
        document.getElementById("tabReg").classList.remove("active");
    }else{
        loginForm.classList.add("hide");
        regForm.classList.remove("hide");
        document.getElementById("tabLogin").classList.remove("active");
        document.getElementById("tabReg").classList.add("active");
    }
}

async function register(){
    const u = document.getElementById("regUser").value.trim();
    const p = document.getElementById("regPwd").value.trim();
    const p2 = document.getElementById("regPwd2").value.trim();
    if(!u || !p){ alert("账号和密码不能为空"); return; }
    if(p !== p2){ alert("两次密码不一致"); return; }
    const ret = await apiFetch("/register", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:u, password:p})
    });
    alert(ret.msg);
    if(ret.ok) switchAuth("login");
}

async function login(){
    const u = document.getElementById("loginUser").value.trim();
    const p = document.getElementById("loginPwd").value.trim();
    const ret = await apiFetch("/login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:u, password:p})
    });
    if(!ret.ok) { alert(ret.msg); return; }
    currentUsername = u;
    localStorage.setItem("ds_user", u);
    await loadUserData();
    enterMain();
}

function logout(){
    localStorage.removeItem("ds_user");
    currentUsername = "";
    document.getElementById("authPage").classList.remove("hide");
    document.getElementById("mainPage").classList.add("hide");
}

async function enterMain(){
    document.getElementById("authPage").classList.add("hide");
    document.getElementById("mainPage").classList.remove("hide");
    document.getElementById("currentUser").innerText = "当前用户：" + currentUsername;
    renderAll();
}

async function init(){
    if(currentUsername){
        await loadUserData();
        enterMain();
    }
}

function renderAll(){
    renderItems();
    renderWish();
    renderStats();
}

async function renderItems(){
    const container = document.getElementById("item_container");
    let html = "";
    userData.items.forEach(item=>{
        html += `
        <div class="item-card status-${item.status}">
            <div>
                <h4>${item.name}</h4>
                <p>品类：${item.category}｜状态：${item.status}</p>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="changeStatus(${item.id})">修改状态</button>
                <button class="btn btn-edit" onclick="openEditItemModal(${item.id})">编辑</button>
                <button class="btn btn-del" onclick="delItem(${item.id})">删除</button>
            </div>
        </div>
        `
    })
    container.innerHTML = html;
}

async function changeStatus(id){
    const item = userData.items.find(i=>i.id === id);
    if(!item) return;
    const statusArr = ["使用中","疑似闲置","待出售","待丢弃","已处理"];
    const idx = statusArr.indexOf(item.status);
    item.status = statusArr[(idx+1) % statusArr.length];
    await saveToServer();
    renderItems();
    renderStats();
}

async function delItem(id){
    if(!confirm("确定删除？")) return;
    userData.items = userData.items.filter(i=>i.id !== id);
    await saveToServer();
    renderItems();
    renderStats();
}

function openEditItemModal(id){
    const item = userData.items.find(i=>i.id === id);
    if(!item) return;
    document.getElementById("editItemId").value = item.id;
    document.getElementById("edit_name").value = item.name;
    document.getElementById("edit_category").value = item.category;
    document.getElementById("edit_status").value = item.status;
    document.getElementById("editItemModal").style.display = "flex";
}
function closeEditItemModal(){
    document.getElementById("editItemModal").style.display = "none";
}
async function updateItem(){
    const id = Number(document.getElementById("editItemId").value);
    const name = document.getElementById("edit_name").value.trim();
    const category = document.getElementById("edit_category").value;
    const status = document.getElementById("edit_status").value;
    if(!name){ alert("名称不能为空"); return; }
    const item = userData.items.find(i=>i.id === id);
    if(item){
        item.name = name;
        item.category = category;
        item.status = status;
    }
    closeEditItemModal();
    await saveToServer();
    renderItems();
    renderStats();
}

function openModal(){
    document.getElementById("modal").style.display = "flex";
}
function closeModal(){
    document.getElementById("modal").style.display = "none";
}
async function saveItem(){
    const name = document.getElementById("name").value.trim();
    const category = document.getElementById("category").value;
    const status = document.getElementById("status").value;
    if(!name){ alert("名称不能为空"); return; }
    userData.items.push({
        id: Date.now(),
        name, category, status
    });
    closeModal();
    await saveToServer();
    renderItems();
    renderStats();
}

async function renderWish(){
    const container = document.getElementById("wish_container");
    let html = "";
    userData.wish.forEach(item=>{
        html += `
        <div class="item-card" style="background:#fff;">
            <div>
                <h4>${item.name}</h4>
                <p>价格：¥${item.price}｜冷静剩余：${item.coolDays}天｜刚需等级：${item.needLevel}</p>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="buyOrGiveup(${item.id})">决策</button>
                <button class="btn btn-edit" onclick="openEditWishModal(${item.id})">编辑</button>
                <button class="btn btn-del" onclick="delWish(${item.id})">删除</button>
            </div>
        </div>
        `
    })
    container.innerHTML = html;
}

async function delWish(id){
    if(!confirm("确定删除？")) return;
    userData.wish = userData.wish.filter(w=>w.id !== id);
    await saveToServer();
    renderWish();
    renderStats();
}

function openEditWishModal(id){
    const item = userData.wish.find(w=>w.id === id);
    if(!item) return;
    document.getElementById("editWishId").value = item.id;
    document.getElementById("edit_wish_name").value = item.name;
    document.getElementById("edit_wish_price").value = item.price;
    document.getElementById("edit_wish_cool").value = item.coolDays;
    document.getElementById("edit_wish_level").value = item.needLevel;
    document.getElementById("editWishModal").style.display = "flex";
}
function closeEditWishModal(){
    document.getElementById("editWishModal").style.display = "none";
}
async function updateWish(){
    const id = Number(document.getElementById("editWishId").value);
    const wName = document.getElementById("edit_wish_name").value.trim();
    const wPrice = Number(document.getElementById("edit_wish_price").value);
    const wCool = Number(document.getElementById("edit_wish_cool").value);
    const wLevel = Number(document.getElementById("edit_wish_level").value);
    if(!wName || isNaN(wPrice) || wPrice <=0 || isNaN(wCool) || wCool <=0 || isNaN(wLevel) || wLevel<1 || wLevel>5){
        alert("输入数据非法");
        return;
    }
    const item = userData.wish.find(w=>w.id === id);
    if(item){
        item.name = wName;
        item.price = wPrice;
        item.coolDays = wCool;
        item.needLevel = wLevel;
    }
    closeEditWishModal();
    await saveToServer();
    renderWish();
    renderStats();
}

async function buyOrGiveup(id){
    const idx = userData.wish.findIndex(w=>w.id === id);
    if(idx === -1) return;
    const choice = confirm("确认购入？确认后转入物品列表");
    if(choice){
        const w = userData.wish[idx];
        userData.items.push({
            id: Date.now(),
            name:w.name,
            category:"其他",
            status:"使用中"
        })
    }
    userData.wish.splice(idx,1);
    await saveToServer();
    renderWish();
    renderItems();
    renderStats();
}

function openWishModal(){
    document.getElementById("wishModal").style.display = "flex";
}
function closeWishModal(){
    document.getElementById("wishModal").style.display = "none";
}
async function saveWish(){
    const wName = document.getElementById("wish_name").value.trim();
    const wPrice = Number(document.getElementById("wish_price").value);
    const wCool = Number(document.getElementById("wish_cool").value);
    const wLevel = Number(document.getElementById("wish_level").value);
    if(!wName || isNaN(wPrice) || wPrice <=0 || isNaN(wCool) || wCool <=0 || isNaN(wLevel) || wLevel<1 || wLevel>5){
        alert("请检查输入");
        return;
    }
    userData.wish.push({
        id: Date.now(),
        name:wName,
        price:wPrice,
        coolDays:wCool,
        needLevel:wLevel
    })
    closeWishModal();
    await saveToServer();
    renderWish();
    renderStats();
}

function renderStats(){
    const idleCount = userData.items.filter(i=>i.status === "疑似闲置").length;
    document.getElementById("stat_text").innerText = `闲置物品：${idleCount} 件 / 总物品：${userData.items.length}`;
    document.getElementById("wish_stat").innerText = `种草数量：${userData.wish.length} 件`;
    const sumMoney = userData.wish.reduce((s, w)=> s + w.price, 0);
    document.getElementById("money_stat").innerText = `潜在消费：¥${sumMoney}`;
}

init();
</script>
</body>
</html>
